services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creative_circle
      POSTGRES_USER: creative_circle
      POSTGRES_PASSWORD: change-me
    volumes:
      - pg_data:/var/lib/postgresql/data
  web:
    build: .
    command: node server.js
    env_file: .env
    volumes:
      - media_data:/data
    depends_on: [postgres]
  worker:
    build: .
    command: node dist-worker/scripts/worker.js
    env_file: .env
    volumes:
      - media_data:/data
    depends_on: [postgres]
volumes:
  pg_data:
  media_data:
